name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  # 测试环境一律使用低轮数 bcrypt：它能把接口套件从 20 秒级压到秒级
  TAX_BCRYPT_ROUNDS: "4"

jobs:
  # ------------------------------------------------------------------ #
  # 静态检查：最快失败，先跑
  # ------------------------------------------------------------------ #
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: pip install "ruff>=0.6"

      - name: Ruff 检查
        run: ruff check . --output-format=github

      - name: Ruff 格式检查
        run: ruff format --check .

  # ------------------------------------------------------------------ #
  # 各测试层并行执行
  # ------------------------------------------------------------------ #
  unit:
    name: 单元层
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 单元测试（含覆盖率）
        run: pytest tests/unit -q --cov --cov-report=xml --cov-report=term-missing

      - name: 上传覆盖率
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml
          if-no-files-found: error

  api-integration:
    name: 接口层 + 集成层
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 接口与集成测试
        run: pytest tests/api tests/integration -q --alluredir=allure-results

      - name: 上传 Allure 原始结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

  contract:
    name: 契约层
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 契约测试（含 OpenAPI 模糊测试）
        run: pytest tests/contract -q

  ui:
    name: UI 层
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 安装 Chromium
        run: python -m playwright install --with-deps chromium

      - name: UI 自动化测试
        run: pytest tests/ui -q

      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-screenshots
          path: artifacts/ui
          if-no-files-found: ignore

  perf:
    name: 性能层
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 负载与延迟基线
        run: pytest tests/perf -q -s

  # ------------------------------------------------------------------ #
  # 修复验证：切到 standard 实现，所有需求符合性用例必须真正通过
  # ------------------------------------------------------------------ #
  verify-fix:
    name: 修复验证（standard 实现）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 安装 Chromium
        run: python -m playwright install --with-deps chromium

      - name: 全量套件（standard 实现）
        env:
          TAX_CALCULATOR_IMPL: standard
        run: pytest -q

      - name: 断言不存在 xfail
        env:
          TAX_CALCULATOR_IMPL: standard
        run: |
          # standard 模式下不应有任何 xfail：修复后所有需求符合性断言都必须真正通过。
          # 若这里出现 xfail，说明有人用 xfail 掩盖了未修复的缺陷。
          output=$(pytest -q --no-header 2>&1 | tail -1)
          echo "$output"
          if echo "$output" | grep -q "xfailed"; then
            echo "::error::standard 模式下仍存在 xfail，说明修复未完成或 xfail 标记未清理"
            exit 1
          fi

  # ------------------------------------------------------------------ #
  # 汇总门禁
  # ------------------------------------------------------------------ #
  quality-gate:
    name: 质量门禁
    runs-on: ubuntu-latest
    needs: [lint, unit, api-integration, contract, ui, perf, verify-fix]
    if: always()
    steps:
      - name: 检查上游任务结果
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "unit=${{ needs.unit.result }}"
          echo "api-integration=${{ needs.api-integration.result }}"
          echo "contract=${{ needs.contract.result }}"
          echo "ui=${{ needs.ui.result }}"
          echo "perf=${{ needs.perf.result }}"
          echo "verify-fix=${{ needs.verify-fix.result }}"

          failed=0
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.unit.result }}" \
            "${{ needs.api-integration.result }}" \
            "${{ needs.contract.result }}" \
            "${{ needs.ui.result }}" \
            "${{ needs.perf.result }}" \
            "${{ needs.verify-fix.result }}"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::存在未通过的质量门禁，阻断合并"
            exit 1
          fi
          echo "全部质量门禁通过"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-testops"
version = "0.1.0"
description = "个人所得税计算服务的分层自动化测试工程（单元 / 接口 / 契约 / UI / 性能）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-rerunfailures>=14.0",
    "pytest-html>=4.1",
    "allure-pytest>=2.13",
    "respx>=0.21",
    "schemathesis>=3.30",
    "locust>=2.30",
    "playwright>=1.45",
    "faker>=25.0",
    "jsonschema>=4.22",
    "ruff>=0.6",
]
redis = ["redis>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "artifacts", "var"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 警告
    "F",    # pyflakes
    "I",    # isort 导入排序
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ARG",  # 未使用的参数
    "PL",   # pylint 子集
]
ignore = [
    "PLR0913",  # 参数过多：FastAPI 依赖注入与测试工厂函数天然参数多
    "PLR2004",  # 魔法值：测试中的期望值本就是字面量
    "PLR0911",  # return 语句过多
    "PLR0912",  # 分支过多
    "PLR0915",  # 语句过多
    "PLR0904",  # 公开方法过多：测试类按主题聚合是刻意的
    "SIM117",   # 嵌套 with：Playwright 的 expect_response 场景下更清晰
]

[tool.ruff.lint.per-file-ignores]
# 测试与脚本中大量使用断言、长函数与固定期望值
"tests/**" = ["ARG001", "ARG002", "ARG005", "B011", "PLR2004", "S101"]
"scripts/**" = ["T201", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["tax_service", "support"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: 单元测试层，纯函数级，毫秒级",
    "platform: 测试平台层，用例管理与执行编排",
    "api: 接口测试层，通过 HTTP 契约验证",
    "integration: 集成测试层，涉及数据库/缓存/外部依赖",
    "contract: 契约测试层，基于 OpenAPI 规范生成用例",
    "ui: UI 自动化层，Playwright 驱动真实浏览器",
    "perf: 性能测试层，需显式指定 --run-perf 才执行",
    "whitebox: 白盒用例，按独立路径设计",
    "blackbox: 黑盒用例，按需求规格设计",
    "characterization: 缺陷特征化用例，锁定当前实现行为",
    "smoke: 冒烟用例，每次提交必跑",
    "regression: 回归用例，PR 门禁全跑",
    "slow: 单条执行超过 1 秒的用例",
]
filterwarnings = [
    # starlette 1.10 起建议用 httpx2 替代内置 TestClient，属第三方告警，与本项目代码无关
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["tax_service"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
